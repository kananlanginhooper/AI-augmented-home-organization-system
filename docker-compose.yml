# Same file on the laptop and on the server. All settings come from .env (see .env.example).
# No database service: the API connects to the shared Postgres server at DB_HOST.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: home-organization
    env_file: .env
    ports:
      # IPv4 only, on one address: the LAN address on a server, 127.0.0.1 on a laptop. Never 0.0.0.0 or [::].
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8109}:${API_PORT:-8109}"
    volumes:
      # Photos live on the host, outside the image and outside git.
      - "${PHOTO_HOST_DIR:-./data/photos}:/data/photos"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"API_PORT\", \"8109\")}/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

# The shared network every home-project container joins. Create it once per machine with
# `docker network create --subnet <shared subnet> homelab` (the subnet is in the home dev standard).
networks:
  default:
    name: homelab
    external: true
